
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELNQ | Login</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #14243a;
}
header {
  background: #102542;
  color: white;
  padding: 23px 8%;
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 2px;
}
.container {
  max-width: 460px;
  margin: 65px auto;
  padding: 35px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 5px 25px #10254212;
}
h1 {
  text-align: center;
}
.subtitle {
  text-align: center;
  color: #64748b;
  margin-bottom: 30px;
}
label {
  display: block;
  margin: 15px 0 8px;
  font-weight: bold;
  font-size: 14px;
}
input, select {
  width: 100%;
  padding: 14px;
  border: 1px solid #d7dfeb;
  border-radius: 6px;
  font-size: 15px;
}
button {
  width: 100%;
  padding: 15px;
  margin-top: 22px;
  background: #087f8c;
  color: white;
  border: 0;
  border-radius: 6px;
  font-weight: bold;
  cursor: not-allowed;
  opacity: .7;
}
.links {
  text-align: center;
  margin-top: 25px;
  line-height: 2;
}
a {
  color: #087f8c;
  text-decoration: none;
}
.notice {
  color: #64748b;
  font-size: 12px;
  line-height: 1.6;
  margin-top: 20px;
}
footer {
  text-align: center;
  padding: 25px;
  color: #64748b;
}
</style>
</head>
<body>

<header>VELNQ</header>

<div class="container">
  <h1>Welcome Back</h1>
  <p class="subtitle">
    Sign in to your Velnq account
  </p>

  <form>
    <label for="role">Account Type</label>
    <select id="role" required>
      <option value="">Choose account type</option>
      <option value="buyer">Buyer</option>
      <option value="supplier">Supplier</option>
    </select>

    <label for="email">Business Email</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      required
    >

    <button type="button" disabled>
      Login Coming Soon
    </button>
  </form>

  <div class="links">
    <a href="register.html">Create an account</a>
    <br>
    <a href="index.html">Back to Homepage</a>
  </div>

  <p class="notice">
    Secure login will be activated after connecting
    Velnq to its authentication database.
  </p>
</div>

<footer>
  © 2026 VELNQ. All Rights Reserved.
</footer>

</body>
</html>
